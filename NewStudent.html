<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/bootstrap-extended.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/fonts/simple-line-icons/style.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/colors.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Shemsy Coding</title>
    <style>
        
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
 
}

/* LAYOUT */
.dashboard {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 20%;
  background: #ffa600;
  padding: 20px;
}
.logo{
    font-weight: bold;
    margin-bottom: 30px;  
}
.logo2{
    width: 4vw;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar li {
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.3s;
}

.sidebar li i {
  margin-right: 10px;
}

.sidebar li:hover,
.sidebar .active {
  background: #fff9d9;
  transform: translateX(35px);
}

/* CONTENT */
.content{
    background-color: #fff9d9;
    width: 100%;
}



.space1{
    display: flex;
    height: 80px;
}


</style>
    
</head>
<body onload="generateID()">
<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h4 class="logo">
        
        <div class="logo2">
            <img src="images/logo/shemsy logo bw.png" alt="" height="100%" width="100%">
        </div>
        
        Shemsy Coding
    </h4>
    <ul>
      <li onclick="window.location.href='home.html'"><i class="bi bi-speedometer2"></i>Dashboard</li>
      <li onclick="window.location.href='StudentsList.html'"><i class="bi bi-people"></i>Students</li>
      <li onclick="window.location.href='AbsencesList.html'"><i class="bi bi-calendar-check"></i>Absences</li>
      <li onclick="window.location.href='NewStudent.html'" class="active"><i class="bi bi-person-plus"></i>Register</li>
      <li onclick="window.location.href='MarkAbsence.html'"><i class="bi bi-person-slash"></i>Mark</li>
      <li><i class="bi bi-door-open"></i>Categories</li>
      <li onclick="window.location.href='loginPage.html'"><i class="bi bi-box-arrow-in-left"></i> Log Out</li>
    </ul>
  </aside>

  <!-- MAIN -->
<main class="content">
    
<div class="container">
<div class="page">
<div class="form-container">

    <div class="form-card">

      <div class="form-avatar">
        <i class="form-avatar-icon bi bi-person-vcard"></i>
      </div>

      <h2 class="form-title">Add New Student</h2>

      <div class="form-group">
        <i class="form-icon bi bi-person-bounding-box"></i>
        <input class="form-input" type="number" placeholder="ID" id="iiid" readonly>
      </div>

      <div class="form-group">
        <i class="form-icon bi bi-person"></i>
        <input class="form-input" type="text" placeholder="First Name" id="firstname">
      </div>

      <div class="form-group">
        <i class="form-icon bi bi-person-badge"></i>
        <input class="form-input" type="text" placeholder="Second Name" id="scndname">
      </div>

      <div class="form-group">
        <i class="form-icon bi bi-person-standing"></i>
        <input class="form-input" type="number" placeholder="age" id="ageee">
      </div>

      <div class="form-group">
        <i class="form-icon bi bi-fire"></i>
        <input class="form-input" list="options-division" type="text" placeholder="Division" id="division">
        <datalist id="options-division">
          <option value="INFOS">
          <option value="MATH">
          <option value="PC">
          <option value="SVT">
          <option value="ANIME">
          <option value="PROGRA">
        </datalist>
      </div>

      <div class="form-group">
        <i class="form-icon bi bi-backpack"></i>
        <input class="form-input" list="level-options" type="text" placeholder="Level" id="lvll">
        <datalist id="level-options">
          <option value="1AC">
          <option value="2AC">
          <option value="3AC">
          <option value="TC">
          <option value="1BAC">
          <option value="2BAC">
          <option value="BAC+1">
          <option value="BAC+2">
          <option value="BAC+3">
          <option value="BAC+4">
          <option value="BAC+5">
          <option value="Out of Shcool">   
        </datalist>
      </div>

      <button type="button" class="form-button" id="saveBtn" onclick="SaveData()">Register</button>
      

    </div>

  </div>
</div>
</div>
</div>


    

<div class="saveoverlay" id="saveoverlay">
    <div class="modal">
        <p id="text">Saving...</p>
        <div class="progress" id="progress"></div>
    </div>
</div>



<style>
/* Button */
button {
    padding: 10px 20px;
    font-size: 16px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* Overlay */
.saveoverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
}

/* Modal */
.modal {
    width: 260px;
    background: #fff;
    border-radius: 10px;
    text-align: center;
    padding: 30px 20px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
}

/* Text */
.modal p {
    color: #0d6efd;
    font-size: 18px;
    font-weight: 500;
    margin: 0;
}

/* Progress bar */
.progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 0;
    background: #0d6efd;
    border-radius: 0 0 10px 10px;
    animation: loading 3s linear forwards;
}

/* Animation */
@keyframes loading {
    from { width: 0; }
    to   { width: 100%; }
}
</style>

</main>
</div>
<script src="script.js"></script>


</body>

</html>
