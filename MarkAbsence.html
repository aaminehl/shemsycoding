<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/bootstrap-extended.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/fonts/simple-line-icons/style.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/colors.min.css">
    <link rel="stylesheet" type="text/css" href="https://pixinvent.com/stack-responsive-bootstrap-4-admin-template/app-assets/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Shemsy Coding</title>
    <style>
        
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
 
}

/* LAYOUT */
.dashboard {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 20%;
  background: #ffa600;
  padding: 20px;
}
.logo{
    font-weight: bold;
    margin-bottom: 30px;  
}
.logo2{
    width: 4vw;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar li {
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.3s;
}

.sidebar li i {
  margin-right: 10px;
}

.sidebar li:hover,
.sidebar .active {
  background: #fff9d9;
  transform: translateX(35px);
}

/* CONTENT */
.content{
    
    background: linear-gradient(135deg, #fff9d9, #ffffff);
    width: 100%;
}



.space1{
    display: flex;
    height: 80px;
}


.absence-card {
  width: 380px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.15);
}

.switch {
  display: flex;
  margin-bottom: 20px;
  border-radius: 30px;
  overflow: hidden;
  border: 3px solid #f1c40f;
}

.switch button {
  flex: 1;
  padding: 10px;
  border: none;
  background: white;
  cursor: pointer;
  transition: .3s;
}

.switch button.active {
  background: #f1c40f;
  color: black;
  font-weight: bold;
  border-radius: 30px;
}

.avatar {
  width: 90px;
  height: 90px;
  margin: 10px auto 20px;
  background: #f1c40f;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: bold;
  box-shadow: 0 10px 20px rgba(0,0,0,.2);
  transition: .3s;
}

.avatar:hover {
  transform: scale(1.1);
}

.form-control {
  border-radius: 12px;
  padding: 10px;
}
.inputt{
   border: 2px solid #d4ac0d00;
}
.inputt:hover{
  border: 2px solid #d4ac0d;
  background-color: #d4ac0d44;
}
.inputt:focus{
    border: 2px solid #d4ac0d;
    background-color: #d4ac0d44;
}

.submit-btn {
  width: 100%;
  background: #f1c40f;
  border: none;
  border-radius: 15px;
  padding: 10px;
  font-weight: bold;
  transition: .3s;
}

.submit-btn:hover {
  background: #d4ac0d;
  transform: translateY(-2px);
}
.button-brows{
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #d4ac0d00;
    height: 5vh;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #f1c40f;
    color: #f1c40f;
    font-weight: bold;
    justify-content: space-between;
    transition: 0.3s;
}
.button-brows:hover{
    background-color: #f1c40f;
    color: black;
}
.browse-mode {
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
}


</style>
    
</head>
<body>
<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h4 class="logo">
        
        <div class="logo2">
            <img src="images/logo/shemsy logo bw.png" alt="" height="100%" width="100%">
        </div>
        
        Shemsy Coding
    </h4>
    <ul>
      <li onclick="window.location.href='home.html'"><i class="bi bi-speedometer2"></i>Dashboard</li>
      <li onclick="window.location.href='StudentsList.html'"><i class="bi bi-people"></i>Students</li>
      <li onclick="window.location.href='AbsencesList.html'"><i class="bi bi-calendar-check"></i>Absences</li>
      <li onclick="window.location.href='NewStudent.html'"><i class="bi bi-person-plus"></i>Register</li>
      <li class="active" onclick="window.location.href='MarkAbsence.html'"><i class="bi bi-person-slash"></i>Mark</li>
      <li><i class="bi bi-door-open"></i>Categories</li>
      <li onclick="window.location.href='loginPage.html'"><i class="bi bi-box-arrow-in-left"></i> Log Out</li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="content">
    <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="absence-card">

    <!-- Switch -->
    <div class="switch">
      <button id="manualBtn" class="active">Manually</button>
      <button id="browseBtn">Browse</button>
    </div>

    <!-- Browse Mode -->
    <div id="browseMode" class="browse-mode d-none">
     <a href="StudentsList.html">
      <button class="button-brows">
        <i class="bi bi-upload"></i> <div class="shortspace"><style>.shortspace{width: 10px;}</style></div>  Select From the list
      </button>
     </a>
    </div>

    <!-- Form -->
    <form id="absenceForm">

      <div class="avatar" id="avatar">A</div>

      <select id="studentSelect" class="inputt form-control mb-3">
        <option value="">Select Student</option>
      </select>

      <input type="text" class="inputt form-control mb-3" placeholder="apprenant ID" id="apprenantiD" readonly>

      <input type="date" id="absenceDate" class="inputt form-control mb-3">
      <input id="timeInput" class="inputt form-control mb-3" placeholder="Time" list="time">
      <datalist id="time">
        <option value="Morning">
        <option value="Afternoon">
      </datalist>

      <input id="reasonInput" class="inputt form-control mb-3" placeholder="Motif" list="motif">
      <datalist id="motif">
        <option value="Illness">
        <option value="Emergency">
        <option value="Family">
        <option value="Transport">
        <option value="Appointement">
        <option value="Other">
      </datalist>

      <button type="submit" class=" btn submit-btn" id="addAbsenceBtn">Mark Absence</button>

    </form>

    </div>

    </div>
  <!-- Save Modal -->
<div class="modal fade" id="saveModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4" style="border-radius:20px">

      <div id="loaderBox">
        <div class="spinner-border text-warning" style="width:4rem;height:4rem"></div>
        <p class="mt-3 fw-bold">Saving...</p>
      </div>

      <div id="successBox" class="d-none">
        <i class="bi bi-check-circle-fill text-success" style="font-size:60px"></i>
        <p class="mt-3 fw-bold text-success">تم الحفظ بنجاح</p>
      </div>

    </div>
  </div>
</div>
<style>
.modal-content{
  box-shadow: 0 20px 40px rgba(0,0,0,.2);
}

</style>


    

  </main>
</div>
<script>
/* جلب التلاميذ من localStorage */
let students = JSON.parse(localStorage.getItem("students"));

/* إذا لم يكن هناك طلاب */
if (students === null) {
  students = [];
}

/* ربط عناصر HTML */
let select = document.getElementById("studentSelect");
let avatar = document.getElementById("avatar");
let dateInput = document.getElementById("absenceDate");
let apprenantID = document.getElementById('apprenantiD');
let manualBtn = document.getElementById("manualBtn");
let browseBtn = document.getElementById("browseBtn");
let form = document.getElementById("absenceForm");
let browseMode = document.getElementById("browseMode");

/* ===== ملء select بالتلاميذ ===== */
for (let i = 0; i < students.length; i++) {
  let option = document.createElement("option");
  option.value = students[i].id;
  option.textContent = students[i].FirstName + " " + students[i].SecondName;
  select.appendChild(option);
}

/* ===== تغيير الـ Avatar عند اختيار تلميذ ===== */
select.onchange = function () {

  let selectedId = Number(select.value);
  let student = null;

  /* البحث عن التلميذ */
  for (let i = 0; i < students.length; i++) {
    if (students[i].id === selectedId) {
      student = students[i];
      break;
    }
  }

  /* إذا وجد التلميذ */
  if (student !== null) {
    avatar.textContent = student.FirstName.charAt(0).toUpperCase() + student.SecondName.charAt(0).toUpperCase();
    apprenantID.value = student.id
  }
};

/* ===== تاريخ اليوم ===== */
let today = new Date();
dateInput.valueAsDate = today;

/* ===== زر Browse ===== */
browseBtn.onclick = function () {
  browseBtn.classList.add("active");
  manualBtn.classList.remove("active");

  form.classList.add("d-none");
  browseMode.classList.remove("d-none");
};

/* ===== زر Manually ===== */
manualBtn.onclick = function () {
  manualBtn.classList.add("active");
  browseBtn.classList.remove("active");

  form.classList.remove("d-none");
  browseMode.classList.add("d-none");
};


const reasonInput = document.getElementById("reasonInput");
const timeInput = document.getElementById("timeInput");

/* ===== جلب التلميذ المختار ===== */
function getSelectedStudent() {
  let selectedId = Number(select.value);
  if (!selectedId) {
    alert("اختر تلميذًا");
    return null;
  }

  for (let i = 0; i < students.length; i++) {
    if (students[i].id === selectedId) {
      return students[i];
    }
  }
  return null;
}

/* ===== حفظ الغياب ===== */
function saveAbsence(student) {
  let absences = JSON.parse(localStorage.getItem("absences")) || {};
  let date = dateInput.value;

  if (!absences[date]) {
    absences[date] = [];
  }

  let absence = {
    id: student.id,
    name: student.FirstName + " " + student.SecondName,
    avatar: student.FirstName[0] + student.SecondName[0],
    reason: reasonInput.value,
    time: timeInput.value
  };

  absences[date].push(absence);
  localStorage.setItem("absences", JSON.stringify(absences));
}

/* ===== عند إرسال الفورم ===== */
function handleFormSubmit(e) {
  e.preventDefault();

  let student = getSelectedStudent();
  if (student === null) return;

  saveAbsence(student);

  // إظهار النافذة
  let modal = new bootstrap.Modal(document.getElementById("saveModal"));
  modal.show();

  // بعد 2 ثانية: نجاح
  setTimeout(() => {
    document.getElementById("loaderBox").classList.add("d-none");
    document.getElementById("successBox").classList.remove("d-none");
  }, 2000);

  // بعد 3.5 ثواني: إغلاق
  setTimeout(() => {
    modal.hide();

    // إعادة الحالة
    document.getElementById("loaderBox").classList.remove("d-none");
    document.getElementById("successBox").classList.add("d-none");
  }, 3500);
}


/* ===== ربط الفورم ===== */
form.addEventListener("submit", handleFormSubmit);


</script>


</body>

</html>
